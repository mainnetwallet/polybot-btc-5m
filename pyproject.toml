[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "1.0.0"
description = "POLYBOT - autonomous, risk-first Polymarket BTC 5-minute UP/DOWN research and trading system"
requires-python = ">=3.11"
dependencies = [
    "polymarket-client==0.16.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "duckdb>=1.0,<2",
    "pyarrow>=16,<23",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "websockets>=12,<16",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "respx>=0.21,<1",
    "httpx2>=2,<3",
]

[project.scripts]
polybot = "btc5m_bot.cli:main"

[tool.setuptools.packages.find]
include = ["btc5m_bot*"]

# The dashboard's static files are not Python modules. Without this a regular (non-editable)
# `pip install .`, which is what the Render build runs, silently leaves them out.
[tool.setuptools.package-data]
btc5m_bot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
