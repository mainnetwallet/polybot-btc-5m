# Render Blueprint for POLYBOT (PAPER mode), FREE plan.
#
# Runs as a web service. Render exposes ONE public port, served by the tiny listener in
# btc5m_bot/healthserver.py (it binds Render's injected PORT; the code reads PORT when RENDER is
# set). That listener answers /healthz and /health itself (no trading state, no secrets) and
# proxies everything else to the operator dashboard, which still binds loopback only (the engine
# refuses any other host) and enforces its own login (password, session cookie, CSRF, lockout).
# Open https://<your-service>.onrender.com/ to use the dashboard. Set POLYBOT_PUBLIC_DASHBOARD to
# "false" to expose the health endpoints only.
# Mode stays PAPER: config/runtime.json is created with the default mode on first start, and LIVE
# still requires the 23-condition gate plus the typed activation phrase.
#
# Health checks
#   /healthz  liveness. Used as Render's healthCheckPath below. It only fails if the process is
#             gone, so Render never restarts a trading bot just because the engine had a bad minute.
#   /health   readiness. 200 only if the supervisor loop runs, the engine process is alive and its
#             lease is fresh; otherwise 503 with a short "reason". Point UptimeRobot here:
#               https://<your-service>.onrender.com/health
#             (HTTP(s) monitor, 5 min interval; GET or HEAD both work).
#
# FREE plan limits that matter here (see https://render.com/docs/free):
#   * No persistent disk. Recordings (parquet), logs and the local runtime.json mirror live under
#     /tmp/polybot and are lost on every restart, redeploy and spin-down. Everything that matters
#     (Settings, orders, positions, paper trades, approved rules, risk state, audit log) is kept in
#     the external database when you set POLYBOT_DATABASE_URL (below) and is restored on start.
#   * No Shell/SSH, so CLI operator commands (approve-rule, status, backup) cannot be run; use the
#     dashboard instead. Capital defaults to 5 and PAPER rules are auto-approved on every start, but
#     the master trading switch is OFF after each start (runtime.json is wiped): turn it ON in the
#     dashboard Settings or the bot records TRADING_OFF and opens nothing.
#   * Idle services spin down after 15 minutes without inbound traffic. An UptimeRobot monitor
#     keeps it awake, but the 750 free instance hours per month are shared by ALL free web
#     services in the workspace; when they run out, every free service is suspended until next month.
#
# To operate the bot for real, move to a paid plan with a disk: set `plan: starter`, uncomment the
# disk block and the /var/data directory variables below (and remove the /tmp/polybot ones).
#
# Secrets (sync: false) are NOT stored here. Enter their values in the Render dashboard
# (service -> Environment). Generate the first two with: python -m btc5m_bot hash-password
# POLYBOT_DASHBOARD_PASSWORD_HASH is REQUIRED: the engine does not start without it.
services:
  - type: web
    name: polybot-btc-5m
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    # A trading bot should only restart on purpose, so deploys are manual.
    autoDeployTrigger: "off"
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: python -m btc5m_bot supervisor
    healthCheckPath: /healthz
    # Paid plans only (free services cannot attach a disk): keeps the database, parquet
    # recordings, logs and runtime.json across restarts and deploys.
    # disk:
    #   name: polybot-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Ephemeral on the free plan. With a disk use /var/data/data, /var/data/logs, /var/data/config.
      - key: POLYBOT_DATA_DIR
        value: /tmp/polybot/data
      - key: POLYBOT_LOGS_DIR
        value: /tmp/polybot/logs
      - key: POLYBOT_CONFIG_DIR
        value: /tmp/polybot/config
      - key: POLYBOT_HEARTBEAT_ENABLED
        value: "false"
      # Serve the dashboard on the public port (login-protected). "false" = health endpoints only.
      - key: POLYBOT_PUBLIC_DASHBOARD
        value: "true"
      - key: POLYBOT_DASHBOARD_PASSWORD_HASH
        sync: false
      - key: POLYBOT_SESSION_SECRET
        sync: false
      # Durable database for EVERYTHING the bot stores: dashboard Settings (committed here first),
      # orders, positions, paper trades, approved resolution rules, risk state and the audit log.
      # They survive restarts, redeploys and spin-downs even on the free plan (no disk needed).
      # Paste the INTERNAL or external connection URL of a Postgres (Render Postgres, Neon,
      # Supabase ...). Unset = local SQLite file under POLYBOT_DATA_DIR (lost on the free plan).
      - key: POLYBOT_DATABASE_URL
        sync: false
      - key: POLYBOT_CLOB_API_KEY
        sync: false
      - key: POLYBOT_CLOB_API_SECRET
        sync: false
      - key: POLYBOT_CLOB_API_PASSPHRASE
        sync: false
